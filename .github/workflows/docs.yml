name: Despliegue de Documentación
on:
  push:
    branches:
      - main # Se ejecuta cada vez que hay cambios en la rama main

permissions:
  contents: write
  # pages: write
  # id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

#    environment:
#      name: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.x
      - name: Install dependencies
        run: pip install -r requirements-docs.txt
      - name: Build documentation
        run: mkdocs gh-deploy --force # Compila y publica automáticamente
        # run: mkdocs build

